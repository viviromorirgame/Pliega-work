name: Rastreador de Empleo Publico Pliega

on:
  schedule:
    # 07:00 UTC = 09:00 AM en España
    - cron: '0 7 * * *'
    # 14:00 UTC = 16:00 PM (4 PM) en España
    - cron: '0 14 * * *'
  # Boton para lanzarlo manualmente cuando quieras
  workflow_dispatch:

jobs:
  rastrear:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar cliente Supabase
        run: npm install @supabase/supabase-js

      - name: Ejecutar Rastreador
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node crawler.js
